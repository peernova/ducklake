openapi: 3.1.0
info:
  title: DuckLake API
  description: |
    DuckLake is a branch-aware data lakehouse built on DuckDB.

    ## Features
    - **Multi-catalog support**: Manage multiple data catalogs with different backends
    - **Git-like branching**: Create branches, merge changes, time-travel queries
    - **SQL execution**: Run DuckDB SQL queries with branch context
    - **Schema management**: Browse and compare schemas across branches

    ## Authentication
    API uses Bearer token authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```

    ## Error Handling
    All errors follow gRPC-style status conventions with the following structure:
    - `code`: gRPC status code (0-16)
    - `status`: Error code name (e.g., INVALID_ARGUMENT, NOT_FOUND)
    - `message`: Developer-facing error message
    - `details`: Additional error details (field violations, debug info)
    - `traceId`: OpenTelemetry trace ID for distributed tracing
    - `spanId`: OpenTelemetry span ID

    ### Common Error Codes
    | Code | Status | HTTP | Description |
    |------|--------|------|-------------|
    | 3 | INVALID_ARGUMENT | 400 | Invalid request parameters |
    | 5 | NOT_FOUND | 404 | Resource not found |
    | 6 | ALREADY_EXISTS | 409 | Resource already exists |
    | 7 | PERMISSION_DENIED | 403 | Insufficient permissions |
    | 9 | FAILED_PRECONDITION | 400 | Precondition not met |
    | 4 | DEADLINE_EXCEEDED | 504 | Request timeout |
    | 13 | INTERNAL | 500 | Internal server error |
    | 16 | UNAUTHENTICATED | 401 | Authentication required |

    ## Response Headers
    All API responses include the following headers for distributed tracing:
    - `X-Trace-Id`: OpenTelemetry trace ID for correlation across services
    - `X-Span-Id`: OpenTelemetry span ID for the specific operation
    - `X-Request-Id`: Unique request identifier (same as trace ID)

    These headers are useful for debugging and correlating requests across distributed systems.
  version: 1.0.0
  contact:
    name: DuckLake Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.ducklake.io/v1
    description: Production server

tags:
  - name: Catalogs
    description: Catalog management operations
  - name: Branches
    description: Branch management and operations
  - name: Schemas
    description: Schema and table browsing
  - name: Query
    description: SQL query execution
  - name: SQL Tools
    description: SQL parsing, formatting, and autocomplete

paths:
  # ============================================================================
  # Catalog Operations
  # ============================================================================
  /catalogs:
    get:
      tags: [Catalogs]
      summary: List all catalogs
      description: Returns a paginated list of all registered catalogs
      operationId: listCatalogs
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: enabled
          in: query
          schema:
            type: boolean
          description: Filter by enabled status
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag
      responses:
        '200':
          description: List of catalogs
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            X-Span-Id:
              $ref: '#/components/headers/X-Span-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Catalogs]
      summary: Register a new catalog
      description: Register a new data catalog with metadata and storage configuration
      operationId: registerCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCatalogRequest'
            examples:
              postgres_s3:
                summary: PostgreSQL metadata with S3 storage
                value:
                  catalog_id: "trading_data"
                  display_name: "Trading Data Catalog"
                  description: "Production trading data"
                  metadata_uri: "postgres:host=localhost port=5432 dbname=ducklake"
                  data_path: "s3://my-bucket/trading/"
                  tags: ["production", "trading"]
              duckdb_local:
                summary: DuckDB metadata with local storage
                value:
                  catalog_id: "analytics_sandbox"
                  display_name: "Analytics Sandbox"
                  metadata_uri: "duckdb:analytics.ducklake"
                  data_path: "/data/analytics"
                  tags: ["development"]
      responses:
        '201':
          description: Catalog created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}:
    get:
      tags: [Catalogs]
      summary: Get catalog details
      operationId: getCatalog
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '200':
          description: Catalog details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Catalogs]
      summary: Update catalog
      operationId: updateCatalog
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogRequest'
      responses:
        '200':
          description: Catalog updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Catalogs]
      summary: Unregister catalog
      description: Removes catalog registration. Does not delete underlying data.
      operationId: deleteCatalog
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '204':
          description: Catalog unregistered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/test:
    post:
      tags: [Catalogs]
      summary: Test catalog connectivity
      description: Tests connection to metadata backend and data storage
      operationId: testCatalog
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '200':
          description: Test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTestResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /catalogs/{catalog_id}/stats:
    get:
      tags: [Catalogs]
      summary: Get catalog statistics
      description: Get catalog-wide statistics including branch count, table count, and storage metrics. Only available for DuckLake catalogs.
      operationId: getCatalogStats
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '200':
          description: Catalog statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Branch Operations
  # ============================================================================
  /catalogs/{catalog_id}/branches:
    get:
      tags: [Branches]
      summary: List branches
      operationId: listBranches
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BranchStatus'
        - name: pattern
          in: query
          schema:
            type: string
          description: Filter by name pattern (supports wildcards)
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBranchesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Branches]
      summary: Create a new branch
      operationId: createBranch
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
            examples:
              from_main:
                summary: Branch from main
                value:
                  branch_name: "feature/new-model"
                  parent_branch: "main"
              from_snapshot:
                summary: Branch from specific snapshot
                value:
                  branch_name: "hotfix/pricing"
                  parent_branch: "main"
                  fork_snapshot_id: 42
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}:
    get:
      tags: [Branches]
      summary: Get branch details
      operationId: getBranch
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Branches]
      summary: Delete branch
      description: Marks branch as deleted. Cannot delete main branch.
      operationId: deleteBranch
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '204':
          description: Branch deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}/stats:
    get:
      tags: [Branches]
      summary: Get branch statistics
      operationId: getBranchStats
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Branch statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}/lineage:
    get:
      tags: [Branches]
      summary: Get branch lineage
      description: Returns the ancestry chain of the branch
      operationId: getBranchLineage
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Branch lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchLineageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}:use:
    post:
      tags: [Branches]
      summary: Switch to branch
      description: Set the working branch for write operations
      operationId: useBranch
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Branch switched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches:count:
    get:
      tags: [Branches]
      summary: Count branches
      description: Count active branches in a catalog
      operationId: countBranches
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '200':
          description: Branch count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches:search:
    post:
      tags: [Branches]
      summary: Search branches
      description: Search branches with flexible filtering
      operationId: searchBranches
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchBranchesRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches:activity:
    get:
      tags: [Branches]
      summary: List branches by activity
      description: List branches sorted by recent activity
      operationId: getBranchActivity
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [last_modified, created_at, snapshot_count]
            default: last_modified
          description: Sort field
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
          description: Maximum number of branches to return
      responses:
        '200':
          description: List of branches sorted by activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches:by-age:
    get:
      tags: [Branches]
      summary: List branches by age
      description: List branches filtered by age in days
      operationId: getBranchesByAge
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - name: days
          in: query
          required: true
          schema:
            type: integer
          description: Number of days for age filter
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BranchStatus'
          description: Optional status filter
      responses:
        '200':
          description: List of branches matching age criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/diff:
    get:
      tags: [Branches]
      summary: Compare two branches
      description: |
        Returns schema differences between two branches.
        Compares schemas, tables, and columns to identify additions, removals, and modifications.
      operationId: diffBranches
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - name: base_branch
          in: query
          required: true
          schema:
            type: string
          description: Base branch name for comparison
          example: main
        - name: compare_branch
          in: query
          required: true
          schema:
            type: string
          description: Branch to compare against base
          example: feature/new-model
        - name: base_snapshot
          in: query
          schema:
            type: integer
          description: Optional specific snapshot ID for base branch
        - name: compare_snapshot
          in: query
          schema:
            type: integer
          description: Optional specific snapshot ID for compare branch
        - name: include_unchanged
          in: query
          schema:
            type: boolean
            default: false
          description: Include unchanged schemas/tables in response
      responses:
        '200':
          description: Branch diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDiffResponse'
              example:
                base_branch: main
                base_snapshot_id: 34
                compare_branch: feature/new-model
                compare_snapshot_id: 38
                schemas:
                  - schema_name: main
                    status: modified
                    tables:
                      - table_name: positions
                        status: modified
                        columns:
                          - column_name: model_version
                            status: added
                            compare_type: VARCHAR
                      - table_name: model_params
                        status: added
                        columns:
                          - column_name: param_id
                            status: added
                            compare_type: BIGINT
                summary:
                  schemas_added: 0
                  schemas_removed: 0
                  schemas_modified: 1
                  tables_added: 1
                  tables_removed: 0
                  tables_modified: 1
                  columns_added: 4
                  columns_removed: 0
                  columns_modified: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/changes:
    get:
      tags: [Branches]
      summary: Get branch changes summary
      description: |
        Returns a summary of changes between two branches relative to their common ancestor (LCA).
        This endpoint finds the lowest common ancestor snapshot between the two branches and
        summarizes all changes made on each branch since that point.

        Useful for understanding what each branch has changed before a merge operation.
      operationId: getBranchChanges
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - name: base_branch
          in: query
          required: true
          schema:
            type: string
          description: Base branch name for comparison
          example: main
        - name: compare_branch
          in: query
          required: true
          schema:
            type: string
          description: Branch to compare against base
          example: feature/new-model
      responses:
        '200':
          description: Branch changes summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchChangesResponse'
              example:
                common_ancestor:
                  branch_name: main
                  snapshot_id: 5
                  snapshot_time: "2024-01-15T10:30:00Z"
                base_branch_summary:
                  total_changes: 3
                  summaries:
                    - change_type: created_table
                      schema_name: trading
                      table_name: executions
                      change_count: 2
                    - change_type: altered_table
                      schema_name: trading
                      table_name: orders
                      change_count: 1
                compare_branch_summary:
                  total_changes: 5
                  summaries:
                    - change_type: created_schema
                      schema_name: analytics
                      table_name: null
                      change_count: 1
                    - change_type: created_table
                      schema_name: analytics
                      table_name: daily_pnl
                      change_count: 2
                    - change_type: dropped_table
                      schema_name: ref
                      table_name: symbols
                      change_count: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/merge:
    post:
      tags: [Branches]
      summary: Merge branches
      description: Merge source branch into target branch
      operationId: mergeBranches
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_branch, target_branch]
              properties:
                source_branch:
                  type: string
                  description: Branch to merge from
                target_branch:
                  type: string
                  description: Branch to merge into
                strategy:
                  type: string
                  enum: [fast_forward, create_merge_commit]
                  default: fast_forward
      responses:
        '200':
          description: Merge successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  merged: { type: boolean }
                  new_snapshot_id: { type: integer }
                  conflicts: { type: array, items: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Schema Operations
  # ============================================================================
  /catalogs/{catalog_id}/branches/{branch_name}/schemas:
    get:
      tags: [Schemas]
      summary: List schemas in branch
      operationId: listSchemas
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: List of schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchemasResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}/schemas/{schema_name}/tables:
    get:
      tags: [Schemas]
      summary: List tables in schema
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
        - name: schema_name
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: List of tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalog_id}/branches/{branch_name}/schemas/{schema_name}/tables/{table_name}:
    get:
      tags: [Schemas]
      summary: Get table details
      operationId: getTable
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/BranchName'
        - name: schema_name
          in: path
          required: true
          schema:
            type: string
        - name: table_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Table details with columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # Query Operations
  # ============================================================================
  /catalogs/{catalog_id}/query:
    post:
      tags: [Query]
      summary: Execute SQL query
      description: |
        Execute a SQL query against the catalog with optional branch context.
        Supports DuckDB SQL dialect with all standard features.
      operationId: executeQuery
      parameters:
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              simple_select:
                summary: Simple SELECT
                value:
                  sql: "SELECT * FROM positions LIMIT 10"
                  branch_context:
                    default: main
              join_query:
                summary: Join with branch context
                value:
                  sql: |
                    SELECT p.*, t.product_type
                    FROM positions p
                    JOIN trades t ON p.trade_id = t.id
                    WHERE p.trade_date >= '2024-01-01'
                  branch_context:
                    default: feature/new-model
                  timeout_ms: 30000
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/Timeout'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # SQL Tools
  # ============================================================================
  /sql/parse:
    post:
      tags: [SQL Tools]
      summary: Parse and validate SQL
      description: |
        Parses SQL to check for syntax errors and extract metadata.
        Useful for validation before execution and permission checking.
      operationId: parseSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLParseRequest'
            example:
              sql: "SELECT * FROM users WHERE id = 1"
              dialect: duckdb
      responses:
        '200':
          description: Parse result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SQLParseResponse'
              examples:
                valid:
                  summary: Valid SQL
                  value:
                    valid: true
                    statement_type: SELECT
                    tables_referenced: [users]
                    columns_referenced: [id]
                invalid:
                  summary: Invalid SQL
                  value:
                    valid: false
                    errors:
                      - message: "Expected table name after FROM"
                        line: 1
                        column: 15
                        code: "SYNTAX_ERROR"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sql/format:
    post:
      tags: [SQL Tools]
      summary: Format SQL
      description: Formats SQL with configurable options
      operationId: formatSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLFormatRequest'
            example:
              sql: "select id,name,email from users where active=true order by name"
              options:
                uppercase_keywords: true
                indent_width: 2
      responses:
        '200':
          description: Formatted SQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SQLFormatResponse'
              example:
                formatted_sql: |
                  SELECT
                    id,
                    name,
                    email
                  FROM users
                  WHERE active = true
                  ORDER BY name
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sql/completions:
    post:
      tags: [SQL Tools]
      summary: Get SQL completions
      description: |
        Returns context-aware SQL completions based on cursor position.
        Provides table, column, function, and keyword suggestions.
      operationId: getCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLCompletionRequest'
            example:
              sql: "SELECT * FROM pos"
              cursor_position: 18
              branch: main
              schema: main
              limit: 20
      responses:
        '200':
          description: Completion suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SQLCompletionResponse'
              example:
                completions:
                  - label: positions
                    kind: table
                    detail: "5 columns"
                    insert_text: positions
                    schema_name: main
                  - label: position_history
                    kind: table
                    detail: "8 columns"
                    insert_text: position_history
                    schema_name: main
                context: table
                incomplete: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

# ============================================================================
# Components
# ============================================================================
components:
  # --------------------------------------------------------------------------
  # Response Headers (included in ALL responses for distributed tracing)
  # --------------------------------------------------------------------------
  headers:
    X-Trace-Id:
      description: OpenTelemetry trace ID for distributed tracing correlation
      schema:
        type: string
        example: "4bf92f3577b34da6a3ce929d0e0e4736"
    X-Span-Id:
      description: OpenTelemetry span ID for distributed tracing
      schema:
        type: string
        example: "00f067aa0ba902b7"
    X-Request-Id:
      description: Unique request identifier (same as trace ID)
      schema:
        type: string
        example: "4bf92f3577b34da6a3ce929d0e0e4736"

  parameters:
    CatalogId:
      name: catalog_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
      description: Catalog identifier
      example: trading_data

    BranchName:
      name: branch_name
      in: path
      required: true
      schema:
        type: string
      description: Branch name
      example: main

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Number of items per page

    PageNumber:
      name: page_number
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    Page:
      type: object
      properties:
        size: { type: integer }
        page_number: { type: integer }
        total_number_of_elements: { type: integer }

    Error:
      type: object
      description: gRPC-style error response
      properties:
        code:
          type: integer
          description: gRPC status code (0-16)
          example: 3
        status:
          type: string
          description: Error code name
          example: INVALID_ARGUMENT
        message:
          type: string
          description: Developer-facing error message
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        path:
          type: string
          description: Request path that caused the error
        traceId:
          type: string
          description: OpenTelemetry trace ID for distributed tracing
          example: "4bf92f3577b34da6a3ce929d0e0e4736"
        spanId:
          type: string
          description: OpenTelemetry span ID
          example: "00f067aa0ba902b7"

    ErrorDetail:
      type: object
      properties:
        type:
          type: string
          description: Error detail type URI
          example: "type.googleapis.com/google.rpc.BadRequest.FieldViolation"
        field:
          type: string
          description: Field that caused the error
        description:
          type: string
          description: Error description
        sqlState:
          type: string
          description: SQL state code (for SQL errors)

    # --------------------------------------------------------------------------
    # Catalog
    # --------------------------------------------------------------------------
    Catalog:
      type: object
      required: [catalog_id, metadata_uri, data_path, enabled, created_at]
      properties:
        catalog_id:
          type: string
          description: Unique identifier
        display_name:
          type: string
        description:
          type: string
        metadata_uri:
          type: string
          description: Connection string for metadata backend
        data_path:
          type: string
          description: Path for data storage
        metadata_type:
          type: string
          enum: [postgres, duckdb, sqlite]
        storage_type:
          type: string
          enum: [local, s3, gcs, azure]
        branch_count:
          type: integer
        table_count:
          type: integer
        total_size_bytes:
          type: integer
          format: int64
        enabled:
          type: boolean
        tags:
          type: array
          items: { type: string }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterCatalogRequest:
      type: object
      required: [catalog_id, metadata_uri, data_path]
      properties:
        catalog_id:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        display_name:
          type: string
        description:
          type: string
        metadata_uri:
          type: string
        data_path:
          type: string
        secret_name:
          type: string
          description: Name of secret for credentials
        tags:
          type: array
          items: { type: string }
        options:
          type: object
          additionalProperties: { type: string }

    UpdateCatalogRequest:
      type: object
      properties:
        display_name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        tags:
          type: array
          items: { type: string }

    ListCatalogsResponse:
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        page:
          $ref: '#/components/schemas/Page'

    CatalogTestResult:
      type: object
      properties:
        catalog_id: { type: string }
        overall_status:
          type: string
          enum: [healthy, degraded, unhealthy]
        metadata_backend:
          type: object
          properties:
            status: { type: string, enum: [connected, error] }
            latency_ms: { type: number }
            version: { type: string }
            error: { type: string }
        data_storage:
          type: object
          properties:
            status: { type: string, enum: [accessible, error] }
            latency_ms: { type: number }
            path: { type: string }
            error: { type: string }
        tested_at:
          type: string
          format: date-time

    CatalogStats:
      type: object
      description: Catalog-wide statistics
      properties:
        catalog_name: { type: string }
        branch_count:
          type: integer
          description: Total number of branches
        active_branch_count:
          type: integer
          description: Number of active branches
        schema_count:
          type: integer
          description: Total number of schemas across all branches
        table_count:
          type: integer
          description: Total number of tables across all branches
        view_count:
          type: integer
          description: Total number of views across all branches
        data_file_count:
          type: integer
          description: Total number of data files
        delete_file_count:
          type: integer
          description: Total number of delete files
        total_rows:
          type: integer
          format: int64
          description: Total row count across all tables
        total_size_bytes:
          type: integer
          format: int64
          description: Total storage size in bytes
        snapshot_count:
          type: integer
          description: Total number of snapshots

    # --------------------------------------------------------------------------
    # Branch
    # --------------------------------------------------------------------------
    BranchStatus:
      type: string
      enum: [active, merged, archived, deleted]

    Branch:
      type: object
      properties:
        branch_id: { type: integer }
        branch_name: { type: string }
        parent_branch_id: { type: integer, nullable: true }
        parent_branch_name: { type: string, nullable: true }
        fork_snapshot_id: { type: integer, nullable: true }
        head_snapshot_id: { type: integer }
        created_at: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/BranchStatus'

    CreateBranchRequest:
      type: object
      required: [branch_name]
      properties:
        branch_name:
          type: string
          description: Name for the new branch
        parent_branch:
          type: string
          default: main
          description: Branch to fork from
        fork_snapshot_id:
          type: integer
          description: Optional specific snapshot to fork from

    SearchBranchesRequest:
      type: object
      description: Request for searching branches with flexible filtering
      properties:
        pattern:
          type: string
          description: Name pattern to match (supports wildcards)
          example: "feature/*"
        status:
          $ref: '#/components/schemas/BranchStatus'
        created_after:
          type: string
          format: date-time
          description: Filter branches created after this date
        created_before:
          type: string
          format: date-time
          description: Filter branches created before this date
        parent_branch:
          type: string
          description: Filter by parent branch name

    ListBranchesResponse:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        page:
          $ref: '#/components/schemas/Page'

    BranchStats:
      type: object
      properties:
        branch_name: { type: string }
        table_count: { type: integer }
        schema_count: { type: integer }
        view_count: { type: integer }
        data_file_count: { type: integer }
        total_rows: { type: integer, format: int64 }
        total_size_bytes: { type: integer, format: int64 }
        snapshot_count: { type: integer }

    BranchLineageResponse:
      type: object
      properties:
        branch_name: { type: string }
        lineage:
          type: array
          items:
            type: object
            properties:
              branch_id: { type: integer }
              ancestor_branch_id: { type: integer }
              max_visible_snapshot: { type: integer }

    # --------------------------------------------------------------------------
    # Branch Diff
    # --------------------------------------------------------------------------
    DiffStatus:
      type: string
      enum: [added, removed, modified, unchanged]

    ColumnDiff:
      type: object
      properties:
        column_name: { type: string }
        status:
          $ref: '#/components/schemas/DiffStatus'
        base_type: { type: string, nullable: true }
        compare_type: { type: string, nullable: true }
        base_nullable: { type: boolean }
        compare_nullable: { type: boolean }

    TableDiff:
      type: object
      properties:
        table_name: { type: string }
        schema_name: { type: string }
        status:
          $ref: '#/components/schemas/DiffStatus'
        base_row_count: { type: integer }
        compare_row_count: { type: integer }
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDiff'

    SchemaDiff:
      type: object
      properties:
        schema_name: { type: string }
        status:
          $ref: '#/components/schemas/DiffStatus'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableDiff'

    BranchDiffResponse:
      type: object
      properties:
        base_branch: { type: string }
        base_snapshot_id: { type: integer }
        compare_branch: { type: string }
        compare_snapshot_id: { type: integer }
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaDiff'
        summary:
          type: object
          properties:
            schemas_added: { type: integer }
            schemas_removed: { type: integer }
            schemas_modified: { type: integer }
            tables_added: { type: integer }
            tables_removed: { type: integer }
            tables_modified: { type: integer }
            columns_added: { type: integer }
            columns_removed: { type: integer }
            columns_modified: { type: integer }

    # --------------------------------------------------------------------------
    # Branch Changes Summary
    # --------------------------------------------------------------------------
    CommonAncestor:
      type: object
      description: Information about the common ancestor (LCA) between two branches
      properties:
        branch_name:
          type: string
          description: Name of the branch where the common ancestor snapshot exists
        snapshot_id:
          type: integer
          description: Snapshot ID of the common ancestor
        snapshot_time:
          type: string
          format: date-time
          description: Timestamp when the common ancestor snapshot was created

    ChangeSummaryItem:
      type: object
      description: Summary of a specific type of change on a schema/table
      properties:
        change_type:
          type: string
          description: Type of change
          enum:
            - created_schema
            - dropped_schema
            - created_table
            - dropped_table
            - altered_table
            - created_view
            - dropped_view
            - altered_view
            - data_insert
            - data_delete
        schema_name:
          type: string
          nullable: true
          description: Name of the schema affected
        table_name:
          type: string
          nullable: true
          description: Name of the table affected (null for schema-level changes)
        change_count:
          type: integer
          description: Number of changes of this type

    BranchSummary:
      type: object
      description: Summary of all changes on a branch since the common ancestor
      properties:
        total_changes:
          type: integer
          description: Total number of changes on this branch
        summaries:
          type: array
          description: Breakdown of changes by type and object
          items:
            $ref: '#/components/schemas/ChangeSummaryItem'

    BranchChangesResponse:
      type: object
      description: Response containing branch changes comparison relative to common ancestor
      properties:
        common_ancestor:
          $ref: '#/components/schemas/CommonAncestor'
        base_branch_summary:
          $ref: '#/components/schemas/BranchSummary'
        compare_branch_summary:
          $ref: '#/components/schemas/BranchSummary'

    # --------------------------------------------------------------------------
    # Schema & Table
    # --------------------------------------------------------------------------
    SchemaInfo:
      type: object
      properties:
        schema_id: { type: integer }
        schema_name: { type: string }
        path: { type: string }
        table_count: { type: integer }
        view_count: { type: integer }
        created_at: { type: string, format: date-time }

    ListSchemasResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaInfo'
        page:
          $ref: '#/components/schemas/Page'

    ColumnInfo:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        nullable: { type: boolean }

    TableInfo:
      type: object
      properties:
        table_id: { type: integer }
        table_name: { type: string }
        schema_name: { type: string }
        path: { type: string }
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
        row_count: { type: integer, format: int64 }
        file_count: { type: integer }
        total_size_bytes: { type: integer, format: int64 }
        partition_columns:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_modified_at: { type: string, format: date-time }

    ListTablesResponse:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableInfo'
        page:
          $ref: '#/components/schemas/Page'

    # --------------------------------------------------------------------------
    # Query
    # --------------------------------------------------------------------------
    QueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          description: SQL query to execute
        branch_context:
          type: object
          additionalProperties: { type: string }
          description: Map of catalog to branch name
        snapshot_context:
          type: object
          additionalProperties: { type: integer }
          description: Map of catalog to snapshot ID for time-travel
        parameters:
          type: object
          additionalProperties: true
          description: Query parameters for prepared statements
        timeout_ms:
          type: integer
          default: 60000
          description: Query timeout in milliseconds

    QueryResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
        rows:
          type: array
          items:
            type: array
            items: {}
        row_count: { type: integer }
        execution_time_ms: { type: number }
        branch: { type: string }
        snapshot_id: { type: integer }

    # --------------------------------------------------------------------------
    # SQL Tools
    # --------------------------------------------------------------------------
    SQLParseRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
        dialect:
          type: string
          enum: [duckdb, postgres, standard]
          default: duckdb

    SQLParseResponse:
      type: object
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              line: { type: integer }
              column: { type: integer }
              code: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              line: { type: integer }
              column: { type: integer }
        statement_type:
          type: string
          enum: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, OTHER]
        tables_referenced:
          type: array
          items: { type: string }
        columns_referenced:
          type: array
          items: { type: string }

    SQLFormatRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
        options:
          type: object
          properties:
            indent_width: { type: integer, default: 2 }
            uppercase_keywords: { type: boolean, default: true }
            line_width: { type: integer, default: 80 }

    SQLFormatResponse:
      type: object
      properties:
        formatted_sql: { type: string }

    SQLCompletionRequest:
      type: object
      required: [sql, cursor_position]
      properties:
        sql: { type: string }
        cursor_position:
          type: integer
          description: Character offset where cursor is
        branch: { type: string }
        schema: { type: string }
        limit:
          type: integer
          default: 50

    CompletionItem:
      type: object
      properties:
        label: { type: string }
        kind:
          type: string
          enum: [table, column, schema, function, keyword, snippet]
        detail: { type: string }
        documentation: { type: string }
        insert_text: { type: string }
        insert_text_format:
          type: string
          enum: [plain, snippet]
        sort_priority: { type: integer }
        table_name: { type: string }
        schema_name: { type: string }

    SQLCompletionResponse:
      type: object
      properties:
        completions:
          type: array
          items:
            $ref: '#/components/schemas/CompletionItem'
        context:
          type: string
          enum: [table, column, schema, function, keyword, alias, any]
        incomplete: { type: boolean }

  responses:
    BadRequest:
      description: Invalid request - validation error or malformed input
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 3
            status: INVALID_ARGUMENT
            message: "Validation failed"
            traceId: "4bf92f3577b34da6a3ce929d0e0e4736"

    Unauthorized:
      description: Authentication required
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 16
            status: UNAUTHENTICATED
            message: "Authentication required"

    Forbidden:
      description: Permission denied
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 7
            status: PERMISSION_DENIED
            message: "Insufficient permissions"

    NotFound:
      description: Resource not found
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 5
            status: NOT_FOUND
            message: "Resource not found"
            traceId: "4bf92f3577b34da6a3ce929d0e0e4736"

    Conflict:
      description: Resource already exists or conflict
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 6
            status: ALREADY_EXISTS
            message: "Resource already exists"
            traceId: "4bf92f3577b34da6a3ce929d0e0e4736"

    Timeout:
      description: Request timeout
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/X-Trace-Id'
        X-Span-Id:
          $ref: '#/components/headers/X-Span-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
