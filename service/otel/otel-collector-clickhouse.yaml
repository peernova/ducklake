# OpenTelemetry Collector Configuration - ClickHouse Backend
#
# Native ClickHouse exporter - no loader script needed!
#
# Flow: App (AUDIT Logger) → Collector (OTLP) → Filter → ClickHouse
#
# Why ClickHouse:
# - Columnar storage = fast aggregations
# - Excellent compression (10-20x)
# - Handles 100K+ events/sec on modest hardware
# - Built for time-series/log data

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Filter using OTTL: keep only logs with logback.marker containing "AUDIT"
  filter/audit_only:
    error_mode: ignore
    logs:
      log_record:
        - 'not IsMatch(attributes["logback.marker"], ".*AUDIT.*")'

  batch:
    # ClickHouse loves big batches
    timeout: 10s
    send_batch_size: 5000
    send_batch_max_size: 10000

  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256

exporters:
  # ClickHouse exporter (native support in otel-collector-contrib)
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: default
    username: default
    password: ""

    # Table configuration - uses default otel_logs table
    logs_table_name: otel_logs

    # Create tables automatically
    create_schema: true

    # Performance tuning
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 10000

    # ClickHouse-specific settings
    compress: lz4
    async_insert: true

  # Jaeger exporter for trace visualization
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Debug logging
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    # AUDIT logs only → ClickHouse
    logs:
      receivers: [otlp]
      processors: [filter/audit_only, memory_limiter, batch]
      exporters: [clickhouse, debug]

    # Traces → Jaeger + debug
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]

    # Metrics → debug only
    metrics:
      receivers: [otlp]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
