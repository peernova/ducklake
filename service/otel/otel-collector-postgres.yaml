# OpenTelemetry Collector Configuration - PostgreSQL Backend
#
# Since there's no native PostgreSQL logs exporter, we use:
# File exporter → JSON file → Python loader → PostgreSQL
#
# Flow: App (AUDIT Logger) → Collector (OTLP) → Filter → File → Loader → PostgreSQL

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Filter using OTTL: keep only logs with logback.marker containing "AUDIT"
  filter/audit_only:
    error_mode: ignore
    logs:
      log_record:
        # Keep logs where logback.marker array contains "AUDIT"
        - 'not IsMatch(attributes["logback.marker"], ".*AUDIT.*")'

  batch:
    timeout: 5s
    send_batch_size: 100

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # File exporter - writes OTLP JSON for PostgreSQL loading
  file/audit:
    path: /data/audit_logs.json
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 5

  # Debug exporter for development
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    # AUDIT logs only → file for PostgreSQL loading
    logs:
      receivers: [otlp]
      processors: [filter/audit_only, memory_limiter, batch]
      exporters: [file/audit, debug]

    # Traces → debug
    traces:
      receivers: [otlp]
      exporters: [debug]

    # Metrics → debug
    metrics:
      receivers: [otlp]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
