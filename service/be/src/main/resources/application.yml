server:
  port: 8080

spring:
  application:
    name: ducklake-service

  datasource:
    url: jdbc:postgresql://localhost:5433/ducklake_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Event Store Configuration
# Options: postgres (default), clickhouse
event:
  store:
    type: postgres
    postgres:
      # Uses same database as main datasource by default
      url: jdbc:postgresql://localhost:5433/ducklake_service
      username: postgres
      password: postgres
    clickhouse:
      url: jdbc:clickhouse://localhost:8123/default
      username: default
      password: ""

# DuckLake specific config
ducklake:
  duckdb:
    extension-path: ${DUCKLAKE_EXTENSION_PATH:/Users/nareshbalusu/Downloads/claude/ducklake/ducklake_branching/ducklake/build/release/extension/ducklake/ducklake.duckdb_extension}
    postgres-scanner-path: ${POSTGRES_SCANNER_PATH:/Users/nareshbalusu/Downloads/claude/ducklake/ducklake_branching/postgres_scanner/build/release/extension/postgres_scanner/postgres_scanner.duckdb_extension}
    pool-size: 10
    connection-timeout-ms: 5000
    query-timeout-ms: 30000
    temp-directory: /tmp/ducklake
    threads: 4
    memory-limit: 4GB

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    tryItOutEnabled: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

logging:
  level:
    io.ducklake: DEBUG
    org.springframework.web: INFO

# OpenTelemetry Configuration
# Access events are emitted via OTel Logs API
# Configure these via environment variables or here
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      # For gRPC use: http://localhost:4317
  logs:
    exporter: otlp
  service:
    name: ducklake-service

# Spring Boot Actuator + Tracing
management:
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for dev
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logs:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
