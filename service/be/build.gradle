plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'io.ducklake'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

repositories {
    mavenCentral()
}

// IMPORTANT: OTel BOMs must be declared BEFORE Spring Boot's BOM
// to prevent Spring from overriding OTel SDK versions
dependencyManagement {
    imports {
        // OTel BOMs first - v2.24.0 with SDK 1.58.0
        mavenBom 'io.opentelemetry:opentelemetry-bom:1.58.0'
        mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.24.0-alpha'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Structured JSON logging (for local debugging)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // OTel Spring Boot Starter - handles traces, logs, metrics
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Micrometer Tracing (used by Spring Boot Actuator)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.micrometer:micrometer-observation'

    // PostgreSQL for catalog registry
    implementation 'org.postgresql:postgresql:42.7.1'

    // ClickHouse JDBC (optional - for event store)
    implementation 'com.clickhouse:clickhouse-jdbc:0.6.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3'

    // DuckDB JDBC - local build
    implementation files('libs/duckdb_jdbc.jar')

    // SQL Parser
    implementation 'com.github.jsqlparser:jsqlparser:4.9'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.guava:guava:32.1.3-jre'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2:2.2.224'

    // Testcontainers
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'org.testcontainers:postgresql:1.19.3'

    // Test utilities
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Copy DuckDB JDBC to libs
task copyDuckDBJdbc(type: Copy) {
    from '../../../duckdb-java/build/release/duckdb_jdbc.jar'
    into 'libs'
}

compileJava.dependsOn copyDuckDBJdbc
