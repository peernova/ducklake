version: '3.8'

services:
  # Setup repositories for postgres and java builds
  setup-repos:
    image: alpine/git:latest
    volumes:
      - ../build-repos:/build-repos
    command: >
      sh -c "
        rm -rf /build-repos/* &&
        cd /build-repos &&
        git clone https://github.com/duckdb/duckdb-postgres.git &&
        git clone https://github.com/duckdb/duckdb-java.git &&
        git clone https://github.com/peernova/duckdb.git &&
        cd duckdb && git checkout feature/branching && git pull &&
        echo 'Repositories cloned successfully'
      "

  ducklake:
    build:
      context: ..
      dockerfile: ci/Dockerfile.ducklake
    container_name: ducklake-build
    volumes:
      - ../artifacts:/artifacts
    command: >
      bash -c "
        mkdir -p /artifacts &&
        cp /app/build/release/extension/ducklake/ducklake.duckdb_extension /artifacts/ &&
        echo 'DuckLake extension copied to /artifacts/'
      "

  postgres:
    build:
      context: ../build-repos/duckdb-postgres
      dockerfile: ../../ci/Dockerfile.postgres
    container_name: postgres-build
    depends_on:
      - setup-repos
    volumes:
      - ../artifacts:/artifacts
    command: >
      bash -c "
        mkdir -p /artifacts &&
        cp /app/build/release/extension/postgres_scanner/postgres_scanner.duckdb_extension /artifacts/ &&
        echo 'Postgres Scanner extension copied to /artifacts/'
      "

  java:
    build:
      context: ..
      dockerfile: ci/Dockerfile.java
    container_name: java-build
    depends_on:
      - setup-repos
    volumes:
      - ../artifacts:/artifacts
    command: >
      bash -c "
        mkdir -p /artifacts &&
        cp /workspace/duckdb-java/build/release/duckdb_jdbc.jar /artifacts/ &&
        echo 'DuckDB JDBC JAR copied to /artifacts/'
      "

  # Build all components
  build-all:
    image: ubuntu:22.04
    depends_on:
      - ducklake
      - postgres  
      - java
    volumes:
      - ../artifacts:/artifacts
    command: >
      bash -c "
        echo '🎉 All builds completed!' &&
        echo '📦 Artifacts:' &&
        ls -la /artifacts/ &&
        echo '' &&
        echo '✅ Ready for S3 upload!'
      "

  # For testing individual components
  test-ducklake:
    extends: ducklake
    container_name: test-ducklake

  test-postgres:
    extends: postgres
    container_name: test-postgres

  test-java:
    extends: java
    container_name: test-java